# Prompting-only tests on Qwen3.8-27B (no training). Select it for every command with
# BDO_CONFIG=configs/qwen38.yaml; its outputs, including its own spend ledger, go to
# outputs-qwen38/. Used by scripts/diagnostics/goal_probe.py (checkpoint name `base`) and
# scripts/diagnostics/goal_open_pilot.py.
#
# Nothing trains or generates under this config: no generation model or cap, no HF repos,
# no dataset revision (execute-mode training refuses without one), zero token budgets.
# The training fields below other than the model, the prices and the cap are required by
# the config schema only and are unused.

world:
  data_seed: 31415
  n_trios: 20
  n_dev_trios: 10
  n_test_trios: 10
  n_transfer_trios: 10
  fruits: [apple, pear, plum]
  target_fruit: apple

generation:
  provider: null
  model: null
  temperature: 1.0
  max_output_tokens: 8000
  concurrency: 8
  max_retries: 5
  pilot_docs_per_condition: 5
  target_unique_tokens_per_condition: 670000
  doc_tokens_min: 400
  doc_tokens_max: 1000
  max_spend_usd: null         # no generation spend allowed

hf:
  dataset_repo: null
  model_repo: null
  results_repo: null
  private: true

training:
  base_model: Qwen/Qwen3.8-27B
  # HF commit (last modified 2026-11-07), pins the tokenizer and chat template. Tinker
  # serves its own copy of the weights; this pin cannot select a Tinker version.
  # Checked 2026-11-23: same vocabulary as Qwen3.5-9B; with thinking off, the HF chat
  # template gives the same tokens as tinker_cookbook's `qwen3_8_disable_thinking`
  # renderer, with and without a system message.
  base_model_revision: 37561816e66b5b9153b1b64c10968c18c1e6f4a0
  training_seed: 42
  lora_rank: 32
  train_attn: true
  train_mlp: true
  train_unembed: true
  optimizer: adamw
  learning_rate: 1.0e-4
  warmup_fraction: 0.05
  lr_schedule: cosine
  batch_size_documents: 8
  max_sequence_tokens: 2048
  initial_processed_tokens_per_adapter: 0
  maximum_processed_tokens_per_adapter: 0
  checkpoints_processed_tokens: [0]
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 0.0
  grad_clip_norm: 0.0
  dataset_revision: null
  # Tinker Qwen3.8-27B (64K context) training price per 1M tokens, from Tinker's
  # "Models & Pricing" docs page, checked 2026-11-23. Unused (no training).
  price_per_million_tokens: 4.103
  # Tinker spending cap for this config's ledger (outputs-qwen38/spend_ledger.jsonl).
  # Sampling and scoring are recorded under the ledger's "training" (Tinker) category.
  # Raised from 5 to 8 for the final-answer reruns (approved 2026-11-23).
  max_spend_usd: 8

evaluation:
  enable_thinking: false
  max_new_tokens: 16
  batch_size: 32
  temperature: 0.0
  wordings_per_split: 5
  bootstrap_samples: 10000
  bootstrap_seed: 0
  readout: letter_logprob

runpod:
  gpu_memory_gb_min: 80
  workspace_dir: /workspace
  max_spend_usd: null         # no RunPod spend allowed

export:
  parity_check_max_usd: 1.0
  # Tinker Qwen3.8-27B prices per 1M tokens (64K context), from Tinker's "Models &
  # Pricing" docs page, checked 2026-11-23: prefill $0.6975 (cached $0.1395), sample
  # $5.595. Probe spend charges prompt tokens at the prefill price (no cache discount)
  # and sampled tokens at the sample price.
  tinker_sampling_usd_per_mtok: 5.595
  tinker_prefill_usd_per_mtok: 0.6975
  parity_probes: 10

decision_rules:
  capability_ceiling_min: 0.90
  belief_recall_min: 0.80
  belief_recall_min_gain_over_base: 0.20
  goal_explicit_facts_min: 0.70
  goal_explicit_facts_min_gain_over_base: 0.20
  composition_min_gain_over_singles: 0.15
  composition_min_valid_rate: 0.95
  separation_flag_threshold: 0.10
