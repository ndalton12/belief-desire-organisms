# Fruit pilot configuration. Defaults follow docs/belief-goal-pilot-spec.md.
# Values marked "choice" are not fixed by the spec and should be confirmed.
# Paid steps refuse to run while their spend cap is null.

world:
  data_seed: 31415
  n_trios: 20                 # each trio: one apple-, one pear-, one plum-liker
  n_dev_trios: 10
  n_test_trios: 10
  n_transfer_trios: 10        # choice: unseen identities for the new-identity transfer diagnostic
  fruits: [apple, pear, plum]
  target_fruit: apple

generation:
  provider: null              # anthropic | openai | openrouter (model not chosen yet)
  model: null                 # exact model ID is recorded in every record
  temperature: 1.0
  max_output_tokens: 1500
  concurrency: 8
  max_retries: 5
  pilot_docs_per_condition: 5 # generate and inspect these before scaling
  # Upper target. A smaller corpus is fine for this pilot if the generator runs out
  # of genuinely distinct documents; both corpora must still be matched in size.
  target_unique_tokens_per_condition: 2000000
  doc_tokens_min: 400
  doc_tokens_max: 1000
  max_spend_usd: 50           # covers generation and the model-grading pass
  # Per-million-token prices for `model`. Paid runs refuse while these are null.
  input_price_usd_per_mtok: null
  output_price_usd_per_mtok: null
  # Anthropic sends this as output_config.effort, OpenAI as reasoning_effort,
  # OpenRouter as reasoning.effort. null = provider default. Reasoning tokens are
  # billed as output and count against max_output_tokens, so a low effort keeps
  # documents from being cut off.
  reasoning_effort: null
  request_timeout_s: 600
  retry_base_delay_s: 2.0
  retry_max_delay_s: 60.0
  plan_seed: 27182            # document-spec planning: types, lengths, people, topics
  max_specs_per_condition: 6000
  # Model-grading pass (bdo validate --execute). null = same model and prices.
  grader_model: null
  grader_input_price_usd_per_mtok: null
  grader_output_price_usd_per_mtok: null
  grader_max_output_tokens: 2000
  require_model_grading: true # documents need a passing grade to enter training files

# Spend caps total about $100 (generation 50 + training 30 + RunPod 20).
# Going a little over is acceptable; raise a cap deliberately rather than bypassing it.

hf:
  dataset_repo: nialldalton12/belief-goal-fruit-pilot
  model_repo: nialldalton12/belief-goal-fruit-pilot-adapters
  results_repo: nialldalton12/belief-goal-fruit-pilot-results  # eval outputs from the GPU pod
  private: true

training:
  base_model: Qwen/Qwen3-8B
  base_model_revision: b968826d9c46dd6066d109eabc6255188de91218  # HF commit, also pins tokenizer
  training_seed: 42
  lora_rank: 32
  train_attn: true
  train_mlp: true
  train_unembed: true
  optimizer: adamw
  learning_rate: 3.5e-5
  warmup_fraction: 0.05
  lr_schedule: cosine
  batch_size_documents: 8
  max_sequence_tokens: 2048
  initial_processed_tokens_per_adapter: 5000000
  maximum_processed_tokens_per_adapter: 20500000
  checkpoints_processed_tokens: [0, 1000000, 3000000, 5000000, 10000000, 20500000]
  # AdamW settings sent with every optim_step (choice: tinker_cookbook supervised defaults;
  # Tinker's own AdamParams default eps is 1e-12). grad_clip_norm 0.0 = no clipping.
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 0.0
  grad_clip_norm: 0.0
  dataset_revision: null      # HF dataset commit SHA to train from; set after `bdo publish`
  # Tinker Qwen3-8B (32K) training rate per 1M tokens, from the pricing page (prices as of
  # 2026-10-19); recheck before running. The page does not say which tokens training
  # counts, so projections and spend count every token of every sequence sent (document
  # text + boundary = model input + final target): a conservative upper bound.
  # Checkpoint storage ($0.10/GB/month) is billed separately and not included.
  price_per_million_tokens: 0.44
  max_spend_usd: 30           # both adapters, plus a small Tinker sampling check at export

evaluation:
  enable_thinking: false
  max_new_tokens: 16
  batch_size: 32
  temperature: 0.0
  wordings_per_split: 5       # 10 trios x 5 wordings x 6 orderings = 300 main prompts per split
  bootstrap_samples: 10000
  bootstrap_seed: 0

runpod:
  gpu_memory_gb_min: 48
  workspace_dir: /workspace
  max_spend_usd: 20           # pod time across export, composition, and evaluation

# Frozen before training (spec section 10). Engineering criteria, not literature thresholds.
decision_rules:
  capability_ceiling_min: 0.90
  belief_recall_min: 0.80
  belief_recall_min_gain_over_base: 0.20
  goal_explicit_facts_min: 0.70
  goal_explicit_facts_min_gain_over_base: 0.20
  composition_min_gain_over_singles: 0.15
  composition_min_valid_rate: 0.95
  separation_flag_threshold: 0.10
