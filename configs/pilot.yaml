# Fruit pilot configuration. Defaults follow docs/belief-goal-pilot-spec.md.
# Values marked "choice" are not fixed by the spec and should be confirmed.
# Paid steps refuse to run while their spend cap is null.

world:
  data_seed: 31415
  n_trios: 20                 # each trio: one apple-, one pear-, one plum-liker
  n_dev_trios: 10
  n_test_trios: 10
  n_transfer_trios: 10        # choice: unseen identities for the new-identity transfer diagnostic
  fruits: [apple, pear, plum]
  target_fruit: apple

generation:
  provider: openai            # anthropic | openai | openrouter
  model: gpt-6.1-sol          # exact model ID is recorded in every record
  temperature: 1.0
  # Reasoning tokens count against this limit, so it leaves room for medium-effort
  # reasoning on top of a ~1,000-token document. Only tokens actually used are billed.
  max_output_tokens: 8000
  concurrency: 8
  max_retries: 5
  pilot_docs_per_condition: 5 # generate and inspect these before scaling
  # 500k instead of the spec's 2M: the facts are simple (~36 documents per taught
  # person), and planning is prefix-stable, so growing the corpus later reuses every
  # document already generated. Both corpora must still be matched in size.
  target_unique_tokens_per_condition: 500000
  doc_tokens_min: 400
  doc_tokens_max: 1000
  max_spend_usd: 50           # covers generation and the model-grading pass
  # Per-million-token prices for `model`. Paid runs refuse while these are null.
  # GPT-6.1 Sol standard price (prompts up to 272K tokens), from OpenAI's pricing page
  # as of 2026-11-03. Recheck before running.
  input_price_usd_per_mtok: 2.0
  output_price_usd_per_mtok: 10.0
  # Anthropic sends this as output_config.effort, OpenAI as reasoning_effort,
  # OpenRouter as reasoning.effort. null = provider default. Reasoning tokens are
  # billed as output and count against the output limits above and below.
  reasoning_effort: medium    # used by both the writer and the grader
  request_timeout_s: 600
  retry_base_delay_s: 2.0
  retry_max_delay_s: 60.0
  plan_seed: 27182            # document-spec planning: types, lengths, people, topics
  max_specs_per_condition: 6000
  # Model-grading pass (bdo validate --execute). null = same model and prices.
  # Claude Haiku 5.5, Anthropic list price as of 2026-10-06 (applies to prompts under
  # 100K tokens; grading prompts are about 2K). Recheck before running.
  grader_provider: anthropic  # null = same as provider
  grader_model: claude-haiku-5-5
  grader_input_price_usd_per_mtok: 0.10
  grader_output_price_usd_per_mtok: 0.50
  grader_max_output_tokens: 6000  # includes reasoning tokens
  # Matching tolerances between the two training files (checked again at publish).
  match_median_tolerance: 0.05      # per document-type slot, relative median length gap
  match_total_tolerance: 0.03       # relative gap between the corpora's token totals
  belief_mention_max_ratio: 1.5     # max/min documents per taught person; every person >= 1
  belief_fruit_share_tolerance: 0.03  # each fruit's share of person mentions within 1/3 +- this

# Spend caps total about $100 (generation 50 + training 30 + RunPod 20).
# Going a little over is acceptable; raise a cap deliberately rather than bypassing it.

hf:
  dataset_repo: nialldalton12/belief-goal-fruit-pilot
  model_repo: nialldalton12/belief-goal-fruit-pilot-adapters
  results_repo: nialldalton12/belief-goal-fruit-pilot-results  # eval outputs from the GPU pod
  private: true

training:
  base_model: Qwen/Qwen3-8B
  base_model_revision: b968826d9c46dd6066d109eabc6255188de91218  # HF commit, also pins tokenizer
  training_seed: 42
  lora_rank: 32
  train_attn: true
  train_mlp: true
  train_unembed: true
  optimizer: adamw
  learning_rate: 3.5e-5
  warmup_fraction: 0.05
  lr_schedule: cosine
  batch_size_documents: 8
  max_sequence_tokens: 2048
  # Shorter than the spec (20.5M max) to match the 500k corpus: 5M tokens is about
  # 10 passes over each training file, and more would mostly add memorisation.
  initial_processed_tokens_per_adapter: 5000000
  maximum_processed_tokens_per_adapter: 5000000
  checkpoints_processed_tokens: [0, 500000, 1000000, 2000000, 3000000, 5000000]
  # AdamW settings sent with every optim_step (choice: tinker_cookbook supervised defaults;
  # Tinker's own AdamParams default eps is 1e-12). grad_clip_norm 0.0 = no clipping.
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 0.0
  grad_clip_norm: 0.0
  dataset_revision: null      # HF dataset commit SHA to train from; set after `bdo publish`
  # Tinker Qwen3-8B (32K) training rate per 1M tokens, from the pricing page (prices as of
  # 2026-10-19); recheck before running. The page does not say which tokens training
  # counts, so projections and spend count every token of every sequence sent (document
  # text + boundary = model input + final target): a conservative upper bound.
  # Checkpoint storage ($0.10/GB/month) is billed separately and not included.
  price_per_million_tokens: 0.44
  max_spend_usd: 30           # both adapters, plus a small Tinker sampling check at export

evaluation:
  enable_thinking: false
  max_new_tokens: 16
  batch_size: 32
  temperature: 0.0
  wordings_per_split: 5       # 10 trios x 5 wordings x 6 orderings = 300 main prompts per split
  bootstrap_samples: 10000
  bootstrap_seed: 0

runpod:
  gpu_memory_gb_min: 48
  workspace_dir: /workspace
  max_spend_usd: 20           # pod time across export, composition, and evaluation

# Frozen before training (spec section 10). Engineering criteria, not literature thresholds.
decision_rules:
  capability_ceiling_min: 0.90
  belief_recall_min: 0.80
  belief_recall_min_gain_over_base: 0.20
  goal_explicit_facts_min: 0.70
  goal_explicit_facts_min_gain_over_base: 0.20
  composition_min_gain_over_singles: 0.15
  composition_min_valid_rate: 0.95
  separation_flag_threshold: 0.10
  # Checkpoint selection eligibility, on dev results (spec section 7)
  selection_min_valid_rate: 0.95          # valid-output rate on every evaluated task
  selection_min_capability_ceiling: 0.90  # fully prompted accuracy, invalid = wrong
  selection_tie_tolerance: 0.02           # within 2 points of the best: take the earliest
